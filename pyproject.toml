[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-tree-wizard"
version = "1.0.0"
description = "Лёгкий движок древовидных inline-опросников (wizard) для aiogram 3"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Артем Самарин" },
]
keywords = ["aiogram", "telegram", "telegram-bot", "inline-keyboard", "fsm", "wizard"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "aiogram>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/I1obody/tg-tree-wizard"
Repository = "https://github.com/I1obody/tg-tree-wizard"
Issues = "https://github.com/I1obody/tg-tree-wizard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tg_tree_wizard = ["py.typed"]
